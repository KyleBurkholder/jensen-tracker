name: Update headlines

on:
  schedule:
    - cron: "17 * * * *"     # every hour
  workflow_dispatch:          # lets you start it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_news.py news.json
      - name: Commit if changed
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update headlines"
          git push
